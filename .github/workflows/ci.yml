name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax:
    name: JavaScript syntax check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Check tracked JavaScript files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(git ls-files -z '*.js' '*.mjs' '*.cjs')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No tracked JavaScript files found."
            exit 1
          fi
          for file in "${files[@]}"; do
            echo "Checking ${file}"
            node --check "${file}"
          done

  install-smoke:
    name: Instalar Yui-Bails y probar
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Instalar dependencias (compila Yui-Bails desde GitHub)
        run: npm install --no-audit --no-fund
      - name: Comprobar que Yui-Bails exporta lo que usa el bot
        run: |
          node --input-type=module -e "
          import makeWASocket, * as y from 'yui-bails'
          const need = ['useMultiFileAuthState','makeCacheableSignalKeyStore','DisconnectReason','downloadMediaMessage','jidNormalizedUser']
          const missing = need.filter(k => !(k in y))
          if (typeof makeWASocket !== 'function') missing.push('default (makeWASocket)')
          if (missing.length) { console.error('Faltan exports:', missing.join(', ')); process.exit(1) }
          console.log('Yui-Bails OK:', need.length + 1, 'exports comprobados')
          "
      - name: Cargar los módulos del bot que usan Yui-Bails
        run: node --input-type=module -e "await import('./lib/media.js'); console.log('lib/media.js OK')"
      - name: Pruebas
        # se ejecuta el archivo directo: el ejecutor `node --test` de Node 22 falla al leer su salida
        run: node tests/autoreply.test.js

name: Security audit

on:
  push:
    branches: [main]
    paths:
      - "**/*.js"
      - "**/*.mjs"
      - "**/*.cjs"
      - "package.json"
      - "package-lock.json"
      - "npm-shrinkwrap.json"
      - ".env*"
      - ".github/workflows/security-audit.yml"
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Scan for accidentally committed secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        id: gitleaks
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Summarize secret scan status
        if: always()
        env:
          SCAN_OUTCOME: ${{ steps.gitleaks.outcome }}
        run: |
          if [ "$SCAN_OUTCOME" = "success" ]; then
            echo "### Secret scan" >> "$GITHUB_STEP_SUMMARY"
            echo "Gitleaks completed without reporting a finding." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Gitleaks needs review. Inspect the security audit logs; no source files were changed automatically."
            echo "### Secret scan requires review" >> "$GITHUB_STEP_SUMMARY"
            echo "Gitleaks did not complete cleanly or reported a finding. Review the action logs. No source files were changed automatically." >> "$GITHUB_STEP_SUMMARY"
          fi

  dependency-audit:
    name: Audit npm dependencies without changing repository files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Audit package manifest in temporary directory
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f package.json ]; then
            echo "::notice::No package.json found; npm audit was skipped."
            echo "### Dependency audit skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "No package.json was present in the repository root." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          cp package.json "$temp_dir/package.json"
          if [ -f package-lock.json ]; then
            cp package-lock.json "$temp_dir/package-lock.json"
          elif [ -f npm-shrinkwrap.json ]; then
            cp npm-shrinkwrap.json "$temp_dir/npm-shrinkwrap.json"
          else
            echo "No lockfile exists in the repository; generating a temporary lockfile outside the checkout."
            if ! (cd "$temp_dir" && npm install --package-lock-only --ignore-scripts --no-audit --no-fund); then
              echo "::warning::Could not resolve a temporary dependency lockfile. Review the step log; repository files were not changed."
              echo "### Dependency audit needs review" >> "$GITHUB_STEP_SUMMARY"
              echo "A temporary lockfile could not be resolved; no repository files were changed." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          if (cd "$temp_dir" && npm audit --omit=dev --audit-level=high); then
            echo "### Dependency audit" >> "$GITHUB_STEP_SUMMARY"
            echo "npm audit did not report high/critical production dependency issues for the resolved manifest." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::npm audit reported a vulnerability or could not complete. Review the full step log; dependencies were not changed."
            echo "### Dependency audit needs review" >> "$GITHUB_STEP_SUMMARY"
            echo "npm audit reported a vulnerability or could not complete. Review the action log. No dependency files were changed." >> "$GITHUB_STEP_SUMMARY"
          fi
